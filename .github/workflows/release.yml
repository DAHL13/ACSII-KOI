name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify tag matches manifest version
        run: |
          python -c "import json, os; v = json.load(open('manifest.json', encoding='utf-8'))['version']; tag = os.environ['GITHUB_REF_NAME']; assert f'v{v}' == tag, f'Tag {tag} != v{v}'"

      - name: Ensure Chromium or Chrome is available
        run: |
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1 && ! command -v chromium-browser >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y chromium-browser
          fi

      - name: Verify i18n parity and package structure
        run: python scripts/package.py --check

      - name: Run headless unit, UI integration, and smoke tests
        run: python scripts/run-tests.py

      - name: Build MV3 release packages (Chrome + Firefox)
        run: python scripts/package.py --target all

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/ascii-koi-pond-*.zip \
            --title "$GITHUB_REF_NAME — Estanque Koi y Mar Abierto ASCII" \
            --generate-notes
